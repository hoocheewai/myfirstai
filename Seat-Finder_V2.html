<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find your exam seat</title>
<style>
  :root {
    --ink:        #12181f;
    --ink-soft:   #4a5563;
    --paper:      #f4f6f8;
    --card:       #ffffff;
    --rule:       #c9d1d9;
    --rule-soft:  #e3e8ed;
    --seat:       #5b6672;
    --find-bg:    #0b5d3b;
    --find-tint:  #d6efe2;
    --find-text:  #084a30;
    --warn-tint:  #f8dcdf;
    --warn-text:  #7d1620;
    --focus:      #1f6feb;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 940px;
    margin: 0 auto;
    padding: 20px 16px 64px;
  }

  header h1 {
    font-size: clamp(1.35rem, 4.5vw, 1.9rem);
    line-height: 1.15;
    margin: 0 0 6px;
    letter-spacing: -0.015em;
  }

  .sub {
    margin: 0 0 20px;
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.45;
  }

  /* ---------- venue picker ---------- */

  .venue {
    margin-bottom: 16px;
  }

  .venue .lead {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .venue .tabs {
    display: flex;
    gap: 8px;
  }

  .venue button {
    flex: 1 1 0;
    font: inherit;
    font-weight: 600;
    padding: 12px 10px;
    border: 2px solid var(--rule);
    border-radius: 8px;
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    line-height: 1.25;
  }

  .venue button[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }

  /* ---------- search ---------- */

  .search {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }

  label.field {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1 1 auto;
    min-width: 0;
    font: inherit;
    font-size: 1.25rem;
    font-weight: 600;
    padding: 12px 14px;
    border: 2px solid var(--rule);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }

  input[type="text"]:focus-visible,
  button:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  #goBtn {
    font: inherit;
    font-weight: 600;
    padding: 12px 20px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    cursor: pointer;
  }

  /* ---------- answer card ---------- */

  .answer {
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 18px;
    border: 1px solid var(--rule);
    background: var(--card);
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .answer.found {
    background: var(--find-tint);
    border-color: #9cceb6;
    color: var(--find-text);
  }

  .answer.error {
    background: var(--warn-tint);
    border-color: #e0a7ae;
    color: var(--warn-text);
  }

  .answer .seat-no {
    display: block;
    font-size: 1.55rem;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }

  .answer .where {
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.35;
  }

  .answer .detail {
    margin-top: 8px;
    font-weight: 400;
  }

  /* ---------- map ---------- */

  .scroller {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: var(--card);
    padding: 14px;
  }

  .room {
    position: relative;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: #fff;
    margin: 0 auto;
  }

  .fixture {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: calc(var(--chip, 30px) * 0.34);
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    text-align: center;
    padding: 4px 8px;
    border: 1.5px solid var(--ink);
    background: #fff;
    white-space: nowrap;
    line-height: 1.2;
  }

  .fixture.door {
    border-style: dashed;
    border-color: var(--find-bg);
    color: var(--find-bg);
    letter-spacing: 0.04em;
    white-space: pre-line;
    max-width: calc(var(--chip, 30px) * 3.2);
    padding: 4px 6px;
  }

  .table {
    position: absolute;
    transform: translate(-50%, -50%);
    border: 1.5px solid var(--seat);
    border-radius: 40%;
    background: #fbfcfd;
  }

  .chip {
    position: absolute;
    transform: translate(-50%, -50%);
    width: var(--chip, 30px);
    height: var(--chip, 30px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--chip, 30px) * 0.44);
    font-weight: 600;
    color: #fff;
    background: var(--seat);
    border-radius: calc(var(--chip, 30px) * 0.2);
    transition: background 120ms linear, transform 120ms linear;
  }

  .chip.hit {
    background: var(--find-bg);
    font-size: calc(var(--chip, 30px) * 0.5);
    transform: translate(-50%, -50%) scale(1.6);
    box-shadow: 0 0 0 3px var(--find-tint), 0 0 0 5px var(--find-bg);
    z-index: 5;
  }

  .chip.dim { opacity: 0.34; }

  @media (prefers-reduced-motion: reduce) {
    .chip { transition: none; }
  }

  .caption {
    margin: 10px 2px 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
    line-height: 1.45;
  }

  .datawarn {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--warn-tint);
    color: var(--warn-text);
    border: 1px solid #e0a7ae;
    font-size: 0.9rem;
    line-height: 1.45;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Find your exam seat</h1>
    <p class="sub">Pick your room, then type your seat number. Check before you reach the door, so you are not searching the map while others queue behind you.</p>
  </header>

  <noscript>
    <div class="datawarn" style="margin:0 0 18px;">
      This page is not running properly because it has been opened in a file preview rather than a web browser.
      Tap the share button and choose Open in Safari, Open in Chrome, or Open in Browser. Nothing will load until you do.
    </div>
  </noscript>

  <div class="venue">
    <span class="lead">Which room</span>
    <div class="tabs" id="venueTabs"></div>
  </div>

  <div class="search">
    <label class="field" for="seatInput" id="seatLabel">Seat number</label>
    <div class="row">
      <input id="seatInput" type="text" inputmode="numeric" autocomplete="off"
             maxlength="2" placeholder="e.g. 13" aria-describedby="answer">
      <button id="goBtn" type="button">Find seat</button>
    </div>
  </div>

  <div id="answer" class="answer" role="status" aria-live="polite">
    Enter a seat number above and the seat will be marked on the map.
  </div>

  <div class="scroller" id="scroller">
    <div class="room" id="room"></div>
  </div>

  <p class="caption" id="caption"></p>

  <div id="dataCheck"></div>

</div>

<script>
(function () {
  "use strict";

  /* ==================================================================
     SINGLE SOURCE OF TRUTH

     Each venue is transcribed exactly as its plan is printed on the
     wall, with the board at the TOP. That way the data here can be
     checked line by line against the printed sheet.

     Rotation for the student's point of view is handled at render
     time by "doorWall". Never rotate the data itself.

       doorWall: "board"  doors are on the same wall as the board, so
                          a student walks in facing away from it and
                          the map is drawn rotated half a turn.
       doorWall: "rear"   doors are at the far end, so the printed
                          orientation already matches the walk-in view.

     x and y are percentages of the room rectangle.
     dx and dy are the seat offsets from a table centre.
  ================================================================== */

  var VENUES = {

    r20: {
      label: "20 seats",
      note: "5 tables",
      board: "Projection screen",
      doorWall: "board",
      aspect: [1075, 1595],
      maxWidth: 560, chipRatio: 0.068,
      dx: 13.5, dy: 11.0,
      tableW: 14.0, tableH: 14.4,
      doors: [20, 80],
      doorLabel: "Door\n(if here)",
      invigX: 50,
      tables: [
        { x: 22.6, y: 26, band: "front",  side: "left",             seats: { boardEnd: 11, left: 6,  right: 1,  farEnd: 16 } },
        { x: 74.0, y: 26, band: "front",  side: "right",            seats: { boardEnd: 14, left: 4,  right: 9,  farEnd: 19 } },
        { x: 50.0, y: 52, band: "middle", side: "centre",           seats: { boardEnd: 15, left: 5,  right: 10, farEnd: 20 } },
        { x: 22.6, y: 79, band: "back",   side: "left",             seats: { boardEnd: 17, left: 7,  right: 2,  farEnd: 12 } },
        { x: 75.0, y: 79, band: "back",   side: "right",            seats: { boardEnd: 18, left: 3,  right: 8,  farEnd: 13 } }
      ]
    },

    r40: {
      label: "40 seats",
      note: "10 tables",
      board: "Whiteboard",
      doorWall: "board",
      aspect: [1300, 935],
      maxWidth: 820, chipRatio: 0.048,
      dx: 5.5, dy: 8.3,
      tableW: 5.7, tableH: 11.6,
      doors: [20, 80],
      doorLabel: "Door",
      invigX: 50,
      tables: [
        { x: 12, y: 26, band: "front",  side: "far left",        seats: { boardEnd: 36, left: 16, right: 6,  farEnd: 26 } },
        { x: 37, y: 26, band: "front",  side: "left of centre",  seats: { boardEnd: 35, left: 5,  right: 15, farEnd: 25 } },
        { x: 59, y: 26, band: "front",  side: "right of centre", seats: { boardEnd: 34, left: 14, right: 4,  farEnd: 24 } },
        { x: 85, y: 26, band: "front",  side: "far right",       seats: { boardEnd: 33, left: 3,  right: 13, farEnd: 23 } },
        { x: 23, y: 52, band: "middle", side: "left",            seats: { boardEnd: 37, left: 17, right: 7,  farEnd: 27 } },
        { x: 70, y: 52, band: "middle", side: "right",           seats: { boardEnd: 32, left: 12, right: 2,  farEnd: 22 } },
        { x: 12, y: 78, band: "back",   side: "far left",        seats: { boardEnd: 38, left: 18, right: 8,  farEnd: 28 } },
        { x: 37, y: 78, band: "back",   side: "left of centre",  seats: { boardEnd: 39, left: 9,  right: 19, farEnd: 29 } },
        { x: 58, y: 78, band: "back",   side: "right of centre", seats: { boardEnd: 40, left: 10, right: 20, farEnd: 30 } },
        { x: 85, y: 78, band: "back",   side: "far right",       seats: { boardEnd: 31, left: 1,  right: 11, farEnd: 21 } }
      ]
    }
  };

  var ORDER = ["r20", "r40"];
  var venue = VENUES.r20;
  var venueKey = "r20";

  /* ---------------- wording ---------------- */

  var MIRROR = {
    "far left":        "far right",
    "far right":       "far left",
    "left of centre":  "right of centre",
    "right of centre": "left of centre",
    "left":            "right",
    "right":           "left",
    "centre":          "centre"
  };

  function rotated() { return venue.doorWall === "board"; }

  function rowName(t) {
    var near = { front: "nearest row", middle: "middle row", back: "furthest row" };
    var far  = { front: "furthest row", middle: "middle row", back: "nearest row" };
    return (rotated() ? near : far)[t.band];
  }

  function sideName(t) {
    var s = rotated() ? MIRROR[t.side] : t.side;
    return (s === "centre") ? "centre of the room" : s;
  }

  function seatSideName(spot) {
    if (spot === "boardEnd") {
      return rotated()
        ? "the chair at the near end of the table, the end closest to the " + venue.board.toLowerCase()
        : "the chair at the far end of the table, the end closest to the " + venue.board.toLowerCase();
    }
    if (spot === "farEnd") {
      return rotated()
        ? "the chair at the far end of the table, away from the " + venue.board.toLowerCase()
        : "the chair at the near end of the table, away from the " + venue.board.toLowerCase();
    }
    var s = rotated() ? MIRROR[spot] : spot;
    return "the chair on the " + s + " side of the table";
  }

  function seatCount() { return venue.tables.length * 4; }

  /* ---------------- integrity check ---------------- */

  function checkVenue(key) {
    var v = VENUES[key], n = v.tables.length * 4, seen = {}, out = [];

    v.tables.forEach(function (t, i) {
      var nums = [t.seats.boardEnd, t.seats.left, t.seats.right, t.seats.farEnd];
      var digits = {};
      nums.forEach(function (num) {
        if (typeof num !== "number" || num < 1 || num > n) {
          out.push(v.label + ": table " + (i + 1) + " has an out of range seat, " + num + ".");
        }
        if (seen[num]) { out.push(v.label + ": seat " + num + " appears more than once."); }
        seen[num] = true;
        digits[num % v.tables.length] = true;
      });
      if (Object.keys(digits).length !== 1) {
        out.push(v.label + ": table " + (i + 1) + " mixes seats from different groups.");
      }
      if (!MIRROR.hasOwnProperty(t.side)) {
        out.push(v.label + ": table " + (i + 1) + " uses an unknown side name, " + t.side + ".");
      }
    });

    for (var k = 1; k <= n; k++) {
      if (!seen[k]) { out.push(v.label + ": seat " + k + " is missing from the map."); }
    }
    return out;
  }

  /* ---------------- build ---------------- */

  var room     = document.getElementById("room");
  var scroller = document.getElementById("scroller");
  var chips    = {};

  function place(el, x, y) {
    if (rotated()) { x = 100 - x; y = 100 - y; }
    el.style.left = x + "%";
    el.style.top  = y + "%";
  }

  function scaleChips() {
    var w = room.clientWidth;
    if (!w) { return; }
    var size = Math.max(13, Math.min(30, Math.round(w * venue.chipRatio)));
    room.style.setProperty("--chip", size + "px");
  }

  function build() {
    room.innerHTML = "";
    chips = {};

    room.style.aspectRatio = venue.aspect[0] + " / " + venue.aspect[1];
    room.style.width       = "100%";
    room.style.maxWidth    = venue.maxWidth + "px";

    var fixtures = [{ x: 50, y: 4, label: venue.board, cls: "" }];
    venue.doors.forEach(function (dx) {
      fixtures.push({ x: dx, y: 4, label: venue.doorLabel || "Door", cls: "door" });
    });
    fixtures.push({ x: venue.invigX, y: 96, label: "Invigilator's table", cls: "" });

    fixtures.forEach(function (f) {
      var el = document.createElement("div");
      el.className = "fixture " + f.cls;
      el.textContent = f.label;
      place(el, f.x, f.y);
      room.appendChild(el);
    });

    venue.tables.forEach(function (t) {
      var tbl = document.createElement("div");
      tbl.className = "table";
      tbl.style.width  = venue.tableW + "%";
      tbl.style.height = venue.tableH + "%";
      place(tbl, t.x, t.y);
      room.appendChild(tbl);

      [
        [t.seats.boardEnd, t.x,            t.y - venue.dy],
        [t.seats.farEnd,   t.x,            t.y + venue.dy],
        [t.seats.left,     t.x - venue.dx, t.y           ],
        [t.seats.right,    t.x + venue.dx, t.y           ]
      ].forEach(function (s) {
        var c = document.createElement("div");
        c.className = "chip";
        c.textContent = s[0];
        c.setAttribute("aria-hidden", "true");
        place(c, s[1], s[2]);
        room.appendChild(c);
        chips[s[0]] = c;
      });
    });

    scaleChips();
  }

  /* ---------------- describe ---------------- */

  function describe(n) {
    var found = null, spot = "";
    venue.tables.forEach(function (t) {
      Object.keys(t.seats).forEach(function (k) {
        if (t.seats[k] === n) { found = t; spot = k; }
      });
    });
    if (!found) { return null; }

    return {
      band: rowName(found),
      side: sideName(found),
      seatSide: seatSideName(spot),
      mates: [found.seats.boardEnd, found.seats.left, found.seats.right, found.seats.farEnd]
               .filter(function (v) { return v !== n; })
               .sort(function (a, b) { return a - b; })
    };
  }

  /* ---------------- search ---------------- */

  var input  = document.getElementById("seatInput");
  var answer = document.getElementById("answer");

  function clearHighlight() {
    Object.keys(chips).forEach(function (k) {
      chips[k].classList.remove("hit", "dim");
    });
  }

  function idle() {
    clearHighlight();
    answer.className = "answer";
    answer.textContent = "Enter a seat number above and the seat will be marked on the map.";
  }

  function fail(msg) {
    clearHighlight();
    answer.className = "answer error";
    answer.textContent = msg;
  }

  function show(n) {
    clearHighlight();
    Object.keys(chips).forEach(function (k) {
      if (Number(k) !== n) { chips[k].classList.add("dim"); }
    });
    chips[n].classList.add("hit");

    var d = describe(n);
    answer.className = "answer found";
    answer.innerHTML =
      '<span class="seat-no">Seat ' + n + '</span>' +
      '<span class="where">' + d.band + ", " + d.side + '</span>' +
      '<div class="detail">Look for ' + d.seatSide +
      '. The other seats at that table are ' + d.mates.join(", ") + '.</div>';

    scroller.scrollTo({
      left: chips[n].offsetLeft - (scroller.clientWidth / 2),
      behavior: "smooth"
    });
  }

  function run() {
    var raw = input.value.trim();
    if (raw === "") { idle(); return; }
    if (!/^\d{1,2}$/.test(raw)) {
      fail("Seat numbers are digits only. Enter a number between 1 and " + seatCount() + ".");
      return;
    }
    var n = parseInt(raw, 10);
    if (n < 1 || n > seatCount()) {
      fail("This room has seats 1 to " + seatCount() + ". There is no seat " + n +
           ". Check your seat slip, or check you picked the right room above.");
      return;
    }
    show(n);
  }

  input.addEventListener("input", run);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { run(); input.blur(); }
  });
  document.getElementById("goBtn").addEventListener("click", run);

  /* ---------------- venue switching ---------------- */

  var tabs    = document.getElementById("venueTabs");
  var caption = document.getElementById("caption");
  var label   = document.getElementById("seatLabel");

  function setVenue(key) {
    venueKey = key;
    venue = VENUES[key];

    Array.prototype.forEach.call(tabs.children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.key === key));
    });

    label.textContent = "Seat number (1 to " + seatCount() + ")";

    caption.textContent = rotated()
      ? "This map is drawn the way the room looks as you walk in. The doors and the " +
        venue.board.toLowerCase() + " are at the bottom, behind you. The invigilator's table is at the far end."
      : "This map is drawn the way the room looks as you walk in. The doors are at the bottom, behind you. The " +
        venue.board.toLowerCase() + " is at the far end.";

    build();
    run();
    scroller.scrollLeft = 0;
  }

  ORDER.forEach(function (key) {
    var b = document.createElement("button");
    b.type = "button";
    b.dataset.key = key;
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = VENUES[key].label;
    b.addEventListener("click", function () { setVenue(key); });
    tabs.appendChild(b);
  });

  /* ---------------- start ---------------- */

  var problems = ORDER.reduce(function (acc, k) { return acc.concat(checkVenue(k)); }, []);
  if (problems.length) {
    var box = document.createElement("div");
    box.className = "datawarn";
    box.textContent = "Seat data problem, do not rely on this map: " + problems.join(" ");
    document.getElementById("dataCheck").appendChild(box);
  }

  setVenue("r20");
  if (window.innerWidth > 760) { input.focus(); }

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(scaleChips, 120);
  });
})();
</script>
</body>
</html>
